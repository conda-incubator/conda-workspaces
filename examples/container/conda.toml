[workspace]
name = "workspace-container-example"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
python-build = ">=1.2"
setuptools = ">=75"

[pypi-dependencies]
workspace-container-example = { path = "." }

[activation]
scripts = ["activate.sh"]

[activation.env]
WORKSPACE_MESSAGE = "Hello from the locked workspace"

[environments]
runtime = []
